# The eval suite's CI (evals/DESIGN.md §8).
#
# gate: on every pull request into `evals` and every push to it. Builds the corpus, runs the
#   eval tests and all three suites without AI (free and deterministic), and fails if a key
#   metric falls below evals/thresholds.yaml or a deviation found before is no longer found.
# ai: by hand only (workflow_dispatch). Runs Claude Haiku 5.5 on one suite with a hard spending
#   cap, and keeps the result as an artifact to commit. It needs the ANTHROPIC_API_KEY repository
#   secret; without it, the job stops before calling anything. GitHub shows a "Run workflow"
#   button only for workflows on the default branch (master, never changed by the evals), so the
#   job can only be started through the API on `evals`, which is untested (DESIGN.md §8).
name: evals

on:
  pull_request:
    branches: [evals]
  push:
    branches: [evals]
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run with Claude Haiku 5.5"
        type: choice
        options: [comply, generate, analyze, all]
        default: comply
      max_usd:
        description: "Hard spending cap in USD (the Haiku config never allows more than 1.00)"
        type: string
        required: true
        default: "1.00"

permissions:
  contents: read

concurrency:
  group: evals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (no AI)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            evals/requirements.txt
      - name: Install DocForge and the eval suite
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"
          pip install -r evals/requirements.txt
      - name: The corpus code still builds the committed manifest
        run: python -m evals corpus check
      - name: Lint the eval code
        run: ruff check --config evals/ruff.toml evals tests/evals
      - name: Eval tests
        run: python -m pytest tests/evals -q
      - name: Run every suite without AI
        run: python -m evals run --suite all --config evals/configs/no-ai.yaml --out ci-results
      - name: Gate against evals/thresholds.yaml
        run: python -m evals gate ci-results/*.json
      - name: The results page and the README's results block are up to date
        run: python -m evals report --check
      - name: Keep the no-AI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-ai-results
          path: ci-results/
          if-no-files-found: ignore

  ai:
    name: Claude Haiku 5.5 (by hand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUITE: ${{ inputs.suite }}
      MAX_USD: ${{ inputs.max_usd }}
    steps:
      - name: The key is there
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY repository secret first (Settings → Secrets and variables → Actions). Nothing was run."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            evals/requirements.txt
      - name: Install DocForge and the eval suite
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"
          pip install -r evals/requirements.txt
      - name: Dry run (the plan and the cap; nothing is sent)
        run: python -m evals run --suite "$SUITE" --config evals/configs/haiku.yaml --max-usd "$MAX_USD" --dry-run
      - name: Run
        run: python -m evals run --suite "$SUITE" --config evals/configs/haiku.yaml --max-usd "$MAX_USD" --out ai-results
      - name: Keep the result to commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haiku-results
          path: ai-results/
          if-no-files-found: ignore
