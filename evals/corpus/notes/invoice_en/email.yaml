text: |
  Hi Daniel,

  can you raise the invoice for Pellbrook Marine Supplies Ltd (VAT ID GB000000106)? Number
  INV-2026-0160, dated 1 April 2026, payable by 1 May 2026.

  They had 9 months of cloud hosting at €480.00 (€4,320.00), 3 security reviews at €1,200.00
  (€3,600.00), 7 training workshops at €900.00 (€6,300.00) and 11 software licences at
  €220.00 (€2,420.00).

  That makes €16,640.00 net, €3,328.00 VAT, €19,968.00 in total.

  Thanks!
