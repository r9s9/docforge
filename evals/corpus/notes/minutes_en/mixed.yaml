text: |
  Protokoll Security patch review, 10. Mai 2026
  Leitung: Elif Whitcombe, Protokoll: Farid Morandi
  Teilnehmer: Mira Ostwald, Clara Haverkamp, Hannah Achterberg, Samuel Rinaldi
  Agenda: review of last month's incidents, the support backlog, and the planned app release
  Beschluss: Jede Produktkategorie bekommt einen benannten Data Owner; Korrekturen werden
  wöchentlich geprüft.
  Aufgaben:
  - Clarify the licence count with procurement – Hannah Achterberg – 17. Mai 2026
  - Prepare the user training material – Hannah Achterberg – 24. Mai 2026
  - Collect feedback from the pilot users – Hannah Achterberg – 31. Mai 2026
  - Draft the data processing agreement – Samuel Rinaldi – 7. Juni 2026
  - Book the test environment for the load test – Mira Ostwald – 14. Juni 2026
