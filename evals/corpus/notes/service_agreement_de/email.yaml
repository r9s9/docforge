text: |
  Betreff: Vertrag Auerbrunn Maschinenbau

  Hallo Lukas,

  bitte setz den Dienstleistungsvertrag für die Auerbrunn Maschinenbau AG auf.
  Vertragsnummer DV-2026-0447, Vertragsdatum 12.03.2026, Beginn am 01.04.2026.

  Wir übernehmen die Administration ihres Identitäts- und Zugriffsmanagements, also auch das
  Anlegen und Sperren von Benutzerkonten. Die monatliche Vergütung beträgt 12.700,00 €.

  In die Preisliste kommen Vor-Ort-Support (1.200,00 € pro Tag) und Schulungen
  (950,00 € pro Termin).

  Viele Grüße
  Clara
