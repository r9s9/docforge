# The rubric grader for free-text fields (DESIGN.md §6.5). Claude Haiku 5.5, the only cloud model
# in scope. Every generate run uses it when ANTHROPIC_API_KEY is set; `--no-grade` turns it off.
# The key comes from the environment of the shell you run in; it is never printed or saved.
name: grader
provider: anthropic
model: claude-haiku-5-5
effort: medium
max_tokens: 8000  # room for thinking; a cut-off answer would be a failed grade
api_key_env: ANTHROPIC_API_KEY
# The most a generate run may spend while it grades, DocForge's own calls included (the owner's
# €1 rule). The stricter of this and the run's own cap wins.
max_usd: 1.00
